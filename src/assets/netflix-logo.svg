<svg width="195" height="42" viewBox="0 0 195 42" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="QStream Logo">
  <defs>
    <!-- Glowing red drop-shadow filter -->
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Atom Icon (left) -->
  <g transform="translate(21, 21)">
    <!-- Central Nucleus -->
    <circle cx="0" cy="0" r="4" fill="#e50914" filter="url(#logoGlow)" />
    <circle cx="0" cy="0" r="1.5" fill="#ffffff" />

    <!-- Orbit 1 (Rotated 30 deg) -->
    <g transform="rotate(30)">
      <ellipse cx="0" cy="0" rx="16" ry="5" stroke="#e50914" stroke-width="1.8" fill="none" opacity="0.95" />
      <circle cx="16" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Orbit 2 (Rotated 90 deg) -->
    <g transform="rotate(90)">
      <ellipse cx="0" cy="0" rx="16" ry="5" stroke="#e50914" stroke-width="1.8" fill="none" opacity="0.95" />
      <circle cx="-16" cy="0" r="2" fill="#ffffff" />
    </g>

    <!-- Orbit 3 (Rotated 150 deg) -->
    <g transform="rotate(150)">
      <ellipse cx="0" cy="0" rx="16" ry="5" stroke="#e50914" stroke-width="1.8" fill="none" opacity="0.95" />
      <circle cx="16" cy="0" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- Title Text "QSTREAM" (expanded viewBox prevents clipping of the letter 'M') -->
  <text
    x="45"
    y="32"
    fill="#e50914"
    font-family="Arial Black, Impact, Arial, sans-serif"
    font-size="25"
    font-weight="900"
    letter-spacing="1.2"
    filter="url(#logoGlow)"
  >QSTREAM</text>
</svg>
