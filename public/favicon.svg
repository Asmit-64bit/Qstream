<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background glow for dark mode contrast -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Orbit line gradient (neon electric blend) -->
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/> <!-- Electric Blue -->
      <stop offset="50%" stop-color="#8b5cf6"/> <!-- Neon Purple -->
      <stop offset="100%" stop-color="#ec4899"/> <!-- Cyber Pink -->
    </linearGradient>
    
    <!-- Nucleus glow -->
    <radialGradient id="nucleusGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#3b82f6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <!-- Electron glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)" />

  <!-- Orbit 1 (Horizontal / 0 deg) -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="9" opacity="0.9" />

  <!-- Orbit 2 (Rotated 60 deg) -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="9" opacity="0.9" transform="rotate(60 256 256)" />

  <!-- Orbit 3 (Rotated 120 deg) -->
  <ellipse cx="256" cy="256" rx="200" ry="70" fill="none" stroke="url(#orbitGrad)" stroke-width="9" opacity="0.9" transform="rotate(120 256 256)" />

  <!-- Electrons (Beads on the orbits with glow) -->
  <!-- Electron 1 on Orbit 1 -->
  <circle cx="456" cy="256" r="16" fill="#3b82f6" filter="url(#glow)" />
  <circle cx="456" cy="256" r="10" fill="#ffffff" />
  
  <!-- Electron 2 on Orbit 2 -->
  <g transform="rotate(60 256 256)">
    <circle cx="456" cy="256" r="16" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="456" cy="256" r="10" fill="#ffffff" />
  </g>

  <!-- Electron 3 on Orbit 3 -->
  <g transform="rotate(120 256 256)">
    <circle cx="56" cy="256" r="16" fill="#ec4899" filter="url(#glow)" />
    <circle cx="56" cy="256" r="10" fill="#ffffff" />
  </g>

  <!-- Glowing Nucleus in center -->
  <circle cx="256" cy="256" r="50" fill="url(#nucleusGrad)" />
  <circle cx="256" cy="256" r="32" fill="#60a5fa" filter="url(#glow)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" />
</svg>